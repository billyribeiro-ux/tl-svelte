name = "agent-template"
main = "worker/worker.ts"
compatibility_date = "2024-12-30"
# `vite build` writes the SvelteKit SPA (adapter-static) to ./build
assets = { directory = "./build", not_found_handling = "single-page-application" }
preview_urls = true

[observability]
enabled = true

[[routes]]
pattern = "agent.templates.svelte-draw.invalid"
custom_domain = true

# Set up the durable object used for each svelte-draw room
[durable_objects]
bindings = [{ name = "AGENT_DURABLE_OBJECT", class_name = "AgentDurableObject" }]

# Durable objects require migrations to create/modify/delete them
[[migrations]]
tag = "v1"
new_classes = ["SvelteDrawAiDurableObject"]

[[migrations]]
tag = "v2"
renamed_classes = [{ from = "SvelteDrawAiDurableObject", to = "AgentDurableObject" }]
