<!doctype html>
<html lang="en" dir="ltr">
	<head>
		<meta charset="UTF-8" />
		<!-- theme init prevents dark mode flashbang on refresh, and prevents a portion of the flashbang during signin/signout -->
		<script src="/theme-init.js"></script>
		<!-- must stay a classic script ahead of the app module script; see polyfills.js -->
		<script src="/polyfills.js"></script>

		<link rel="manifest" href="/manifest.webmanifest" />
		<meta
			name="keywords"
			content="whiteboard, canvas, virtual online whiteboard, realtime collaboration, collaborative whiteboard, online drawing, team collaboration tool, free whiteboard app, free online whiteboard no sign up, classroom screen"
		/>
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "SoftwareApplication",
				"name": "svelte-draw",
				"url": "https://www.svelte-draw.invalid/",
				"applicationCategory": "BusinessApplication",
				"operatingSystem": "WEB",
				"description": "A free and instant collaborative whiteboarding tool. Free online whiteboard no sign up.",
				"audience": {
					"@type": "Audience",
					"audienceType": "business"
				},
				"creator": {
					"@type": "Organization",
					"name": "svelte-draw"
				}
			}
		</script>
		<style>
			#root {
				position: relative;
				inset: 0;
				width: 100%;
				height: 100%;
				overflow: hidden;
			}

			.visually-hidden {
				position: absolute !important;
				clip: rect(1px, 1px, 1px, 1px);
				height: 1px;
				width: 1px;
				overflow: hidden;
				white-space: nowrap;
				pointer-events: none;
				user-select: none;
				-webkit-user-select: none;
			}
		</style>
		<meta name="referrer" content="strict-origin-when-cross-origin" />
		<meta name="theme-color" content="#FFFFFF" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152x152.svg" />
		<link rel="apple-touch-icon" sizes="167x167" href="/apple-touch-icon-167x167.svg" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180x180.svg" />

		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="svelte-draw" />

		<meta name="application-name" content="svelte-draw" />
		<meta name="title" content="svelte-draw" />
		<meta
			name="description"
			content="A free and instant virtual whiteboarding with online collaboration. No signup required. Works on all devices: mobile, tablets, and desktop."
		/>
		<meta name="image" content="https://www.svelte-draw.invalid/social-twitter.png" />

		<meta name="format-detection" content="telephone=no" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="msapplication-config" content="browserconfig.xml" />
		<meta name="msapplication-TileColor" content="#FFFFFF" />
		<meta name="msapplication-tap-highlight" content="no" />

		<!-- $PRELOADED_FONTS -->

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
		/>

		<!-- $PRELOADED_SPRITES -->
		<!-- The hashed asset urls are only known after the build; the sprite preloads for
		     `src/assets/0_merged_tla.svg` and the SDK's `0_merged.svg` are added by scripts/build.ts. -->

		<meta name="twitter:card" content="summary" />
		<meta name="twitter:url" content="https://www.svelte-draw.invalid/" />
		<meta name="twitter:title" content="svelte-draw" />
		<meta
			name="twitter:description"
			content="A free and instant collaborative whiteboarding tool."
		/>
		<meta name="twitter:image" content="https://www.svelte-draw.invalid/social-twitter.png" />
		<meta name="twitter:image:alt" content="A collaborative whiteboarding tool interface" />
		<meta name="twitter:creator" content="@svelte-draw" />
		<meta property="og:type" content="website" />
		<meta property="og:title" content="svelte-draw" />
		<meta
			property="og:description"
			content="A free and instant collaborative whiteboarding tool."
		/>
		<meta property="og:site_name" content="svelte-draw" />
		<meta property="og:url" content="https://www.svelte-draw.invalid/" />
		<meta property="og:image" content="https://www.svelte-draw.invalid/social-og.png" />
		<meta property="og:image:alt" content="A collaborative whiteboarding tool interface" />

		<title>svelte-draw • very good free whiteboard</title>
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="off">
		<header>
			<h1 class="visually-hidden">svelte-draw - free and instant collaborative whiteboarding</h1>
		</header>
		<!-- SvelteKit mounts the app into the element that holds the body placeholder; the id is what
		     the #root rules above and html[data-theme] rules in styles/globals.css style. Do not write
		     the placeholder in a comment: only its first occurrence is replaced. -->
		<div id="root">%sveltekit.body%</div>
		<noscript>You need to enable JavaScript to run svelte-draw. ✌️</noscript>
	</body>
</html>
