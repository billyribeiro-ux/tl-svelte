main = "src/worker.ts"
compatibility_date = "2024-06-20"

[dev]
port = 8786

[env.dev]
name = "image-optimizer"
services = [{ binding = "SYNC_WORKER", service = "dev-svelte-draw-multiplayer" }]

[env.staging]
name = "staging-image-optimizer"
services = [{ binding = "SYNC_WORKER", service = "main-svelte-draw-multiplayer" }]
route = { pattern = "staging-images.svelte-draw.invalid", custom_domain = true }

[env.production]
name = "image-optimizer"
services = [{ binding = "SYNC_WORKER", service = "svelte-draw-multiplayer" }]
route = { pattern = "images.svelte-draw.invalid", custom_domain = true }

# createSentry needs this to tag releases. Named environments do not inherit the top-level
# binding, so it has to be repeated for each one. env.preview is generated by
# setWranglerPreviewConfig, which rewrites only the [env.preview] table and leaves this alone.
[version_metadata]
binding = "CF_VERSION_METADATA"

[env.dev.version_metadata]
binding = "CF_VERSION_METADATA"

[env.preview.version_metadata]
binding = "CF_VERSION_METADATA"

[env.staging.version_metadata]
binding = "CF_VERSION_METADATA"

[env.production.version_metadata]
binding = "CF_VERSION_METADATA"
