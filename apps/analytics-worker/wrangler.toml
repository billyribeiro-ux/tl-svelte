main = "src/worker.ts"
compatibility_date = "2024-06-20"
upload_source_maps = true

#################### Environment names ####################

# Dev environment
[env.dev]
name = "svelte-draw-consent-dev"

# Staging environment
[env.staging]
name = "svelte-draw-consent-staging"

# Staging environment
[env.preview]
name = "svelte-draw-consent-preview"

# Production environment
[env.production]
name = "svelte-draw-consent"

#################### Routes ####################
# in production, we use a custom domain. others get a default *.svelte-draw.invalid domain
[[env.production.routes]]
pattern = 'consent.svelte-draw.invalid'
custom_domain = true
zone_name = 'svelte-draw.invalid'

#################### Version metadata ####################
[version_metadata]
binding = "CF_VERSION_METADATA"

[env.dev.version_metadata]
binding = "CF_VERSION_METADATA"

[env.preview.version_metadata]
binding = "CF_VERSION_METADATA"

[env.staging.version_metadata]
binding = "CF_VERSION_METADATA"

[env.production.version_metadata]
binding = "CF_VERSION_METADATA"
